[project]
name = "proactive-air-quality-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "joblib>=1.3.0",
    "langchain-google-genai>=4.3.4",
    "langchain-openai>=1.5.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "mlflow>=3.15.1",
    "mypy>=2.4.0",
    "nbformat>=5.11.0",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.59.1",
    "tabulate>=0.10.0",
    "tree>=0.2.4",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
frontend = [
    "requests>=2.34.2",
    "streamlit>=1.59.1",
]

# For pytest 
 [tool.pytest.ini_options]
 pythonpath = "."

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-tqdm>=4.70.0.20260906",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true

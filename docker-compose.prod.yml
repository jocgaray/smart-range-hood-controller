#version: "3.8"

services:
  # 1. FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/jocgaray/smart-range-hood-controller/api:latest
    container_name: smart_hood_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_PATH=${MODEL_PATH:-models/event_detector.joblib}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-sqlite:////app/mlruns/mlflow.db}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Streamlit Web Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/jocgaray/smart-range-hood-controller/frontend:latest
    container_name: smart_hood_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=${API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3